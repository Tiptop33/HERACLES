# Déploie l'instance d'ESSAI de HERACLES sur le VPS.
#
# Rien n'est déployé sans avoir passé lint, tests unitaires, construction et
# toute la suite SQL — y compris les contrôles de RLS. Une règle d'accès cassée
# n'atteint pas le serveur.
#
# Deux installations à la main, une seule fois chacune :
#
#   sudo ./infra/essai/deployer.sh essai.mondomaine.fr api-essai.mondomaine.fr
#   sudo ./infra/essai/preparer-deploiement.sh essai.mondomaine.fr
#
# La première fabrique les secrets de la pile. La seconde ouvre ce workflow, et
# affiche les quatre secrets à coller dans Réglages → Secrets and variables →
# Actions :
#
#   VPS_HOTE          l'adresse du serveur
#   VPS_UTILISATEUR   le compte dédié au déploiement — surtout pas root
#   VPS_CLE_SSH       la clé privée de ce compte, et de lui seul
#   VPS_EMPREINTE     la ligne known_hosts du serveur
#
# VPS_EMPREINTE n'est pas un détail : sans elle, la première connexion accepte
# n'importe quel serveur qui répond à ce nom.
#
# Ce workflow ne dépose aucun fichier sur le serveur et ne lui dit pas quoi
# faire. Il ouvre une connexion, rien de plus : la clé n'accepte qu'un seul
# geste, fixé du côté du serveur, et c'est lui qui va chercher `main` sur
# GitHub. Ce qui tourne vient donc du dépôt, et non de cette machine-ci.
#
# ————— Cette connexion se retente, mais AILLEURS —————
#
# Trois travaux de déploiement à la file, chacun sur une machine que GitHub
# choisit — donc à chaque fois une adresse différente. Le second ne part que
# si le premier a échoué **sans que le serveur réponde**, le troisième de même.
# Dès que le serveur parle, sa réponse fait foi et la chaîne s'arrête net.
#
# CE QUI A ÉTÉ ESSAYÉ AVANT, ET POURQUOI ÇA NE MARCHAIT PAS
#
# On réessayait sur place, cinq fois, puis huit fois en espaçant jusqu'à un
# quart d'heure. Relevé des 9 et 10 août 2026 :
#
#   | run | depuis la même machine | relance sur une autre |
#   | --- | ---------------------- | --------------------- |
#   | #48 | 5 échecs en 4 min      | ✓ 52 s                |
#   | #50 | 5 échecs en 4 min      | ✓ 54 s                |
#   | #53 | 8 échecs en 15 min     | —                     |
#
# Attendre n'a jamais rien donné ; changer de machine a toujours marché, du
# premier coup. Et pendant ces quinze minutes le HTTPS répondait normalement,
# tandis que `sshd` ne voyait strictement rien arriver — pas même un refus.
#
# La seule explication qui tienne : le blocage est **par adresse source**.
# Certaines plages de runners GitHub sont jetées par un pare-feu en amont ;
# celles-là ne passeront jamais, quel que soit le temps qu'on leur laisse. Une
# autre machine tire une autre plage, et passe aussitôt.
#
# D'où ceci. Ce n'est toujours qu'un contournement : la cause est dans un
# pare-feu — celui de l'hôte ou celui de l'hébergeur —, et elle reste à
# trouver.

name: Déployer l'instance d'essai

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

# Deux déploiements en même temps se marcheraient dessus : le second attend, et
# un troisième remplace le second en attente.
concurrency:
  group: essai
  cancel-in-progress: false

jobs:
  verifier:
    name: Vérifier
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Installer
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Tests unitaires
        working-directory: apps/web
        run: npm test

      - name: Construction
        working-directory: apps/web
        # Des valeurs factices suffisent : la construction n'appelle rien, elle
        # ne fait qu'inscrire ces chaînes dans le bundle.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemple.test
          NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-de-construction
        run: npm run build

      - name: Migrations et règles d'accès
        # Le harnais reconstitue le schéma auth de Supabase : la RLS s'éprouve
        # sur un PostgreSQL nu, sans lancer les dix conteneurs de la pile.
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./supabase/tests/executer.sh

  # ———————————————————————————————————————————————————————————————————————————
  # Trois tentatives, trois machines. Le geste lui-même est dans l'action
  # `.github/actions/deployer-par-ssh` : écrit une fois, appelé trois fois.
  #
  # `continue-on-error` sur les deux premières : leur échec ne doit pas peindre
  # tout le run en rouge alors qu'une autre machine va reprendre. C'est le
  # travail « Verdict », à la fin, qui tranche — et lui seul.
  # ———————————————————————————————————————————————————————————————————————————
  deployer:
    name: Déployer
    needs: verifier
    runs-on: ubuntu-latest
    environment: essai
    continue-on-error: true
    # Une tentative qui aboutit prend une minute ; une reconstruction sans
    # cache, quelques-unes. Quinze suffisent, et rendent la main au lieu de
    # tenir la place jusqu'à la limite de six heures.
    timeout-minutes: 15
    outputs:
      reussi: ${{ steps.essai.outputs.reussi }}
      injoignable: ${{ steps.essai.outputs.injoignable }}
    steps:
      - uses: actions/checkout@v4
      - id: essai
        uses: ./.github/actions/deployer-par-ssh
        with:
          cle: ${{ secrets.VPS_CLE_SSH }}
          empreinte: ${{ secrets.VPS_EMPREINTE }}
          hote: ${{ secrets.VPS_HOTE }}
          utilisateur: ${{ secrets.VPS_UTILISATEUR }}

  deployer-2:
    name: Déployer — deuxième machine
    needs: [verifier, deployer]
    # Seulement si la première n'a pas abouti ET que le serveur n'a rien dit.
    # S'il a répondu — migration en échec, clé refusée —, rien à retenter.
    if: >-
      always()
      && needs.deployer.outputs.reussi != 'true'
      && needs.deployer.outputs.injoignable == 'true'
    runs-on: ubuntu-latest
    environment: essai
    continue-on-error: true
    timeout-minutes: 15
    outputs:
      reussi: ${{ steps.essai.outputs.reussi }}
      injoignable: ${{ steps.essai.outputs.injoignable }}
    steps:
      - uses: actions/checkout@v4
      - id: essai
        uses: ./.github/actions/deployer-par-ssh
        with:
          cle: ${{ secrets.VPS_CLE_SSH }}
          empreinte: ${{ secrets.VPS_EMPREINTE }}
          hote: ${{ secrets.VPS_HOTE }}
          utilisateur: ${{ secrets.VPS_UTILISATEUR }}

  deployer-3:
    name: Déployer — troisième machine
    needs: [verifier, deployer, deployer-2]
    if: >-
      always()
      && needs.deployer-2.outputs.reussi != 'true'
      && needs.deployer-2.outputs.injoignable == 'true'
    runs-on: ubuntu-latest
    environment: essai
    timeout-minutes: 15
    outputs:
      reussi: ${{ steps.essai.outputs.reussi }}
      injoignable: ${{ steps.essai.outputs.injoignable }}
    steps:
      - uses: actions/checkout@v4
      - id: essai
        uses: ./.github/actions/deployer-par-ssh
        with:
          cle: ${{ secrets.VPS_CLE_SSH }}
          empreinte: ${{ secrets.VPS_EMPREINTE }}
          hote: ${{ secrets.VPS_HOTE }}
          utilisateur: ${{ secrets.VPS_UTILISATEUR }}

  # Le seul travail qui décide de la couleur du run. Sans lui, une tentative
  # rattrapée par la suivante laisserait le run en rouge, et un échec réel
  # pourrait passer pour vert à cause des `continue-on-error`.
  verdict:
    name: Verdict
    needs: [verifier, deployer, deployer-2, deployer-3]
    # `always()` est nécessaire : les tentatives peuvent être en échec ou
    # sautées, et sans lui ce travail ne partirait pas — donc personne ne
    # dirait rien. En revanche si la vérification a échoué, il n'y a pas eu de
    # déploiement à juger.
    if: always() && needs.verifier.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Une machine a-t-elle déployé ?
        env:
          UN: ${{ needs.deployer.outputs.reussi }}
          DEUX: ${{ needs.deployer-2.outputs.reussi }}
          TROIS: ${{ needs.deployer-3.outputs.reussi }}
        run: |
          set -euo pipefail
          for r in "$UN" "$DEUX" "$TROIS"; do
            if [ "$r" = "true" ]; then
              echo "Déployé."
              exit 0
            fi
          done
          echo "::error::Aucune des machines essayées n'a pu joindre le serveur, ou le serveur a refusé. Rien n'a été déployé ; l'instance tourne encore sur la version précédente. Si les trois disent « injoignable », le pare-feu de l'hôte ou celui de l'hébergeur jette les adresses des runners — voir l'en-tête de ce fichier."
          exit 1
