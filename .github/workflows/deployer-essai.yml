# Déploie l'instance d'ESSAI de HERACLES sur le VPS.
#
# Rien n'est déployé sans avoir passé lint, tests unitaires, construction et
# toute la suite SQL — y compris les contrôles de RLS. Une règle d'accès cassée
# n'atteint pas le serveur.
#
# Deux installations à la main, une seule fois chacune :
#
#   sudo ./infra/essai/deployer.sh essai.mondomaine.fr api-essai.mondomaine.fr
#   sudo ./infra/essai/preparer-deploiement.sh essai.mondomaine.fr
#
# La première fabrique les secrets de la pile. La seconde ouvre ce workflow, et
# affiche les quatre secrets à coller dans Réglages → Secrets and variables →
# Actions :
#
#   VPS_HOTE          l'adresse du serveur
#   VPS_UTILISATEUR   le compte dédié au déploiement — surtout pas root
#   VPS_CLE_SSH       la clé privée de ce compte, et de lui seul
#   VPS_EMPREINTE     la ligne known_hosts du serveur
#
# VPS_EMPREINTE n'est pas un détail : sans elle, la première connexion accepte
# n'importe quel serveur qui répond à ce nom.
#
# Ce workflow ne dépose aucun fichier sur le serveur et ne lui dit pas quoi
# faire. Il ouvre une connexion, rien de plus : la clé n'accepte qu'un seul
# geste, fixé du côté du serveur, et c'est lui qui va chercher `main` sur
# GitHub. Ce qui tourne vient donc du dépôt, et non de cette machine-ci.
#
# Cette connexion, elle, se retente : jusqu'à cinq fois, en espaçant les
# essais. Uniquement quand le serveur n'a pas répondu du tout — dès qu'il
# parle, sa réponse fait foi et rien n'est rejoué. Le détail, et la soirée qui
# l'a motivé, sont au pas « Déclencher le déploiement ».

name: Déployer l'instance d'essai

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

# Deux déploiements en même temps se marcheraient dessus : le second attend, et
# un troisième remplace le second en attente.
concurrency:
  group: essai
  cancel-in-progress: false

jobs:
  verifier:
    name: Vérifier
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Installer
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Tests unitaires
        working-directory: apps/web
        run: npm test

      - name: Construction
        working-directory: apps/web
        # Des valeurs factices suffisent : la construction n'appelle rien, elle
        # ne fait qu'inscrire ces chaînes dans le bundle.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemple.test
          NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-de-construction
        run: npm run build

      - name: Migrations et règles d'accès
        # Le harnais reconstitue le schéma auth de Supabase : la RLS s'éprouve
        # sur un PostgreSQL nu, sans lancer les dix conteneurs de la pile.
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./supabase/tests/executer.sh

  deployer:
    name: Déployer
    needs: verifier
    runs-on: ubuntu-latest
    environment: essai
    # Un déploiement prend une minute. Trente, c'est de quoi encaisser les
    # cinq tentatives et une reconstruction sans cache — au-delà, quelque
    # chose est resté suspendu, et mieux vaut rendre la main que tenir la
    # place jusqu'à la limite de six heures.
    timeout-minutes: 30

    steps:
      - name: Préparer la connexion
        env:
          CLE: ${{ secrets.VPS_CLE_SSH }}
          EMPREINTE: ${{ secrets.VPS_EMPREINTE }}
          HOTE: ${{ secrets.VPS_HOTE }}
        run: |
          set -euo pipefail
          test -n "$CLE"   || { echo "Le secret VPS_CLE_SSH manque."; exit 1; }
          test -n "$HOTE"  || { echo "Le secret VPS_HOTE manque."; exit 1; }

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement

          if [ -n "$EMPREINTE" ]; then
            printf '%s\n' "$EMPREINTE" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_EMPREINTE est vide — le serveur est accepté sur parole."
            ssh-keyscan -H "$HOTE" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Déclencher le déploiement
        env:
          HOTE: ${{ secrets.VPS_HOTE }}
          UTILISATEUR: ${{ secrets.VPS_UTILISATEUR }}
        run: |
          set -uo pipefail

          # Aucune commande n'est passée, et ce n'est pas un oubli : la clé
          # n'en accepte qu'une, inscrite dans `authorized_keys` du côté du
          # serveur. Ce qu'écrirait cette machine-ci ne serait pas lu.
          #
          # Le serveur va chercher `main` sur GitHub, joue les migrations et
          # reconstruit. Sa sortie remonte ici, d'où le journal de ce pas.
          #
          # ————— Pourquoi on réessaie —————
          #
          # Le 8 août 2026, deux déploiements de suite se sont perdus sur un
          # « Connection timed out » : le serveur n'a pas répondu à 23h32, il
          # répondait de nouveau à 23h35, sans que rien n'ait changé entre les
          # deux. Un commit juste ne doit pas rester à quai pour trois minutes
          # d'absence.
          #
          # ————— Pourquoi on réessaie plus longtemps —————
          #
          # Le 9 août, deux fois encore, et plus longtemps : injoignable de
          # 21h59 à 22h04, puis de 22h55 à 23h00. La boucle abandonnait au bout
          # de quatre minutes ; les coupures en duraient cinq et six. Chaque
          # fois, la relance à la main passait du premier coup.
          #
          # Le journal du serveur a tranché : `sshd` n'a **rien vu** de ces
          # tentatives — pas même un refus. Les paquets sont jetés avant lui.
          # Et pendant ce temps le HTTPS répondait sans faillir, sur la même
          # machine, aux mêmes minutes : la machine tourne, c'est le port 22
          # qui est muet. La cause est en amont, dans un pare-feu — celui de
          # l'hôte ou celui de l'hébergeur —, et elle reste à trouver.
          #
          # D'ici là : huit tentatives étalées sur un quart d'heure. Cela
          # couvre largement les quatre coupures observées, dont la plus longue
          # a duré six minutes. **C'est un contournement, pas une réparation** :
          # le jour où le port 22 restera fermé pour de bon, ce déploiement-ci
          # mettra un quart d'heure à le dire au lieu de quatre minutes. C'est
          # le prix, et il est moindre qu'un déploiement perdu par soirée.
          #
          # **On ne réessaie que ce qui n'a jamais atteint le serveur.** Dès
          # qu'il a répondu, sa réponse fait foi : une migration qui échoue,
          # une empreinte qui ne correspond pas ou une clé refusée arrêtent
          # tout, sur-le-champ. Rejouer une empreinte fausse reviendrait à
          # insister auprès d'une machine qui n'est pas la nôtre.
          CONNEXION_PERDUE='ssh: connect to host|Connection timed out|Connection refused|No route to host|Operation timed out|Network is unreachable|Host is unreachable'

          # Quinze secondes pour établir la connexion, au lieu des deux
          # minutes treize que le système laisse filer par défaut : on veut
          # savoir vite, pour réessayer plusieurs fois dans le même temps.
          #
          # Les attentes montent puis se stabilisent à trois minutes : au-delà,
          # doubler encore ne servirait qu'à passer à côté du moment où le
          # serveur revient. Total : 15 + 30 + 60 + 120 + 180 × 3 = 12 min 45 s
          # d'attente, plus huit connexions de 15 s au pire — environ un quart
          # d'heure.
          ATTENTES=(15 30 60 120 180 180 180)
          TENTATIVES=${#ATTENTES[@]}
          journal="$(mktemp)"

          for essai in $(seq 0 "$TENTATIVES"); do
            if (( essai > 0 )); then
              attente=${ATTENTES[$((essai - 1))]}
              echo "::warning::Serveur injoignable — nouvelle tentative dans ${attente} s (${essai}/${TENTATIVES})."
              sleep "$attente"
            fi

            code=0
            ssh -i ~/.ssh/id_deploiement \
                -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=15 \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=20 \
                "$UTILISATEUR@$HOTE" > "$journal" 2>&1 || code=$?
            cat "$journal"

            if (( code == 0 )); then
              exit 0
            fi

            # 255 est le code que `ssh` garde pour ses propres échecs ; tout
            # autre code vient du serveur, et lui appartient.
            if (( code != 255 )) || ! grep -qE "$CONNEXION_PERDUE" "$journal"; then
              echo "::error::Le déploiement s'est arrêté (code $code). Le serveur a répondu : sa sortie est ci-dessus."
              exit "$code"
            fi
          done

          echo "::error::Le serveur est resté injoignable pendant les $((TENTATIVES + 1)) tentatives, soit un quart d'heure. Rien n'a été déployé ; l'instance tourne encore sur la version précédente. Les coupures observées jusqu'ici duraient six minutes au plus : au-delà d'un quart d'heure, ce n'est plus un passage à vide — regardez le pare-feu de l'hôte et celui de l'hébergeur."
          exit 1

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/id_deploiement
