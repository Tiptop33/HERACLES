# Déploie l'instance d'ESSAI de HERACLES sur le VPS.
#
# Rien n'est déployé sans avoir passé lint, tests unitaires, construction et
# toute la suite SQL — y compris les contrôles de RLS. Une règle d'accès cassée
# n'atteint pas le serveur.
#
# Deux installations à la main, une seule fois chacune :
#
#   sudo ./infra/essai/deployer.sh essai.mondomaine.fr api-essai.mondomaine.fr
#   sudo ./infra/essai/preparer-deploiement.sh essai.mondomaine.fr
#
# La première fabrique les secrets de la pile. La seconde ouvre ce workflow, et
# affiche les quatre secrets à coller dans Réglages → Secrets and variables →
# Actions :
#
#   VPS_HOTE          l'adresse du serveur
#   VPS_UTILISATEUR   le compte dédié au déploiement — surtout pas root
#   VPS_CLE_SSH       la clé privée de ce compte, et de lui seul
#   VPS_EMPREINTE     la ligne known_hosts du serveur
#
# VPS_EMPREINTE n'est pas un détail : sans elle, la première connexion accepte
# n'importe quel serveur qui répond à ce nom.
#
# Ce workflow ne dépose aucun fichier sur le serveur et ne lui dit pas quoi
# faire. Il ouvre une connexion, rien de plus : la clé n'accepte qu'un seul
# geste, fixé du côté du serveur, et c'est lui qui va chercher `main` sur
# GitHub. Ce qui tourne vient donc du dépôt, et non de cette machine-ci.

name: Déployer l'instance d'essai

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

# Deux déploiements en même temps se marcheraient dessus : le second attend, et
# un troisième remplace le second en attente.
concurrency:
  group: essai
  cancel-in-progress: false

jobs:
  verifier:
    name: Vérifier
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Installer
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Tests unitaires
        working-directory: apps/web
        run: npm test

      - name: Construction
        working-directory: apps/web
        # Des valeurs factices suffisent : la construction n'appelle rien, elle
        # ne fait qu'inscrire ces chaînes dans le bundle.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemple.test
          NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-de-construction
        run: npm run build

      - name: Migrations et règles d'accès
        # Le harnais reconstitue le schéma auth de Supabase : la RLS s'éprouve
        # sur un PostgreSQL nu, sans lancer les dix conteneurs de la pile.
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./supabase/tests/executer.sh

  deployer:
    name: Déployer
    needs: verifier
    runs-on: ubuntu-latest
    environment: essai

    steps:
      - name: Préparer la connexion
        env:
          CLE: ${{ secrets.VPS_CLE_SSH }}
          EMPREINTE: ${{ secrets.VPS_EMPREINTE }}
          HOTE: ${{ secrets.VPS_HOTE }}
        run: |
          set -euo pipefail
          test -n "$CLE"   || { echo "Le secret VPS_CLE_SSH manque."; exit 1; }
          test -n "$HOTE"  || { echo "Le secret VPS_HOTE manque."; exit 1; }

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement

          if [ -n "$EMPREINTE" ]; then
            printf '%s\n' "$EMPREINTE" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_EMPREINTE est vide — le serveur est accepté sur parole."
            ssh-keyscan -H "$HOTE" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Déclencher le déploiement
        env:
          HOTE: ${{ secrets.VPS_HOTE }}
          UTILISATEUR: ${{ secrets.VPS_UTILISATEUR }}
        run: |
          set -euo pipefail
          # Aucune commande n'est passée, et ce n'est pas un oubli : la clé
          # n'en accepte qu'une, inscrite dans `authorized_keys` du côté du
          # serveur. Ce qu'écrirait cette machine-ci ne serait pas lu.
          #
          # Le serveur va chercher `main` sur GitHub, joue les migrations et
          # reconstruit. Sa sortie remonte ici, d'où le journal de ce pas.
          ssh -i ~/.ssh/id_deploiement -o StrictHostKeyChecking=yes \
            "$UTILISATEUR@$HOTE"

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/id_deploiement
