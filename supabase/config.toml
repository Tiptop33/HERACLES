# Pile Supabase locale de HERACLES.
# Tous les ports sont décalés de ceux de MyCollabus : les deux projets peuvent
# tourner en même temps sur la même machine sans se marcher dessus.

project_id = "heracles"

[api]
enabled = true
port = 54331
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54330
major_version = 15

[studio]
enabled = true
port = 54333

# Boîte mail de test : aucun email ne part vraiment en local.
[inbucket]
enabled = true
port = 54334

[storage]
enabled = true
file_size_limit = "50MiB"

# Journaux (Logflare). Désactivés : ils ne servent qu'à l'onglet « Logs » du
# Studio, coûtent un conteneur de plus, et leur port par défaut — 54327, non
# déclaré dans les sections ci-dessus — entrait en conflit avec une autre pile
# Supabase de la machine. Le port est fixé malgré tout : si on les réactive un
# jour, ce sera sans marcher sur les plates-bandes d'un autre projet.
[analytics]
enabled = false
port = 54337

[auth]
enabled = true
site_url = "http://localhost:3002"
additional_redirect_urls = [
  "http://localhost:3002/auth/callback",
  # Le lien d'invitation mène droit à l'écran d'invitation.
  "http://localhost:3002/invitation/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
